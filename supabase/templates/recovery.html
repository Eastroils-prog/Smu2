<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f5f8f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c2b24;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;border:1px solid #e3ebe6;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 4px;font-size:13px;font-weight:600;color:#047857;">VentureTrack</p>
          <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Reset your password</h1>
          <p style="margin:0 0 16px;font-size:15px;line-height:1.6;">
            We received a request to reset the password for your VentureTrack account.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery"
               style="display:inline-block;padding:12px 20px;border-radius:10px;background:#047857;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">
              Choose a new password
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#5b6b63;">
            This link can be used once and expires after 24 hours. If you did not ask for this, you can ignore
            this e-mail; your password will stay the same.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
